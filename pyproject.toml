[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "update-online-tool"
version = "0.2.5"
description = "NAS-based online update SDK and CLI for desktop applications"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["cryptography>=42"]

[project.scripts]
uot = "update_online_tool.cli:main"
uot-updater = "update_online_tool.updater_cli:main"
uot-bridge = "update_online_tool.bridge_cli:main"
uot-agent = "update_online_tool.agent_cli:main"
uot-bootstrap = "update_online_tool.bootstrap_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
