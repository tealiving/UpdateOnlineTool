name: UOT Windows Process Gates

on:
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/update_online_tool/**"
      - "tests/**"
      - ".github/workflows/windows-process-gates.yml"
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
      - "src/update_online_tool/**"
      - "tests/**"
      - ".github/workflows/windows-process-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uot-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run full Windows suite
        shell: pwsh
        run: python -m pytest -q
